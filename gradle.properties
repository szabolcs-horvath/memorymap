# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Increased memory to 4GB for better performance in larger builds.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Run independent projects in parallel.
org.gradle.parallel=true
# Reuses build outputs from previous builds.
org.gradle.caching=true
# Only configure relevant projects.
org.gradle.configureondemand=true
# Use AndroidX.
android.useAndroidX=true
# Kotlin code style.
kotlin.code.style=official
# Faster builds by not generating transitive R classes.
android.nonTransitiveRClass=true
# Enable KSP incremental processing for Room.
ksp.incremental=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# AGP 9 creates unit tests only for the debug build type by default, but its Compose Preview support (AGP 9.5) fails
# the configuration for a Compose variant without them (release). Release unit tests only exist; nothing runs them.
android.onlyEnableUnitTestForTheTestedBuildType=false
