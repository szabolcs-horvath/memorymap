name: UI tests

# Only started by hand (Actions tab > UI tests > Run workflow), not on pushes or pull requests. The CI emulators
# are fresh every run and never set up with a Google account, so Google Play services never downloads the latest
# map renderer and the map falls back to the legacy one: it doesn't support the app's markers and sometimes draws
# nothing (https://issuetracker.google.com/issues/327248427). The UI tests run locally instead, on an emulator that is
# set up once (docs/ui-tests.md).
on:
  workflow_dispatch:

jobs:
  ui-tests:
    # Two jobs that run at the same time: API 37 is the targetSdk, and API 35 stands in for minSdk 34, whose emulator
    # images all ship a Google Play services (23.18) too old to draw the app's map markers (see app/build.gradle.kts).
    name: UI tests on Android API ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Gradle downloads the emulator and its image each run. Don't cache the image on its own: Gradle then
        # skips installing the emulator too, and the setup fails ("Cannot query the value of this property").
        sdk: [ 35, 37 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The emulator needs hardware acceleration (KVM), which Linux runners have but don't open to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The map needs the Maps key (the location picker tests tap it); sign-in and Drive are faked in the tests.
      - name: Create local.properties file
        run: |
          cat > local.properties <<'PROPS'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          PROPS

      - name: Create google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          JSON

      # The Maps API key only accepts builds signed with a registered key. Without this, CI signs with a new
      # debug key each run, the map rejects it and doesn't react to taps (the location picker tests fail).
      - name: Restore the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::The DEBUG_KEYSTORE_BASE64 secret is not set, so the map won't load and the location picker tests will fail."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Run UI tests
        run: >-
          ./gradlew pixel6Api${{ matrix.sdk }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # A table of the results on the job page, and an annotation for each failed test.
      - name: Summarize the results
        if: always()
        run: java .github/scripts/UiTestSummary.java "Android API ${{ matrix.sdk }}" app/build/outputs/androidTest-results

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-reports-api-${{ matrix.sdk }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/managed_device_android_test_additional_output/
          retention-days: 14
