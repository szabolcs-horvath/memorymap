name: Dependency analysis

# Checks the declared dependencies against what the code uses (the Dependency Analysis Gradle Plugin): when started by
# hand, and on the first of every month. It never fails: read the report on the run's summary page, or download it.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

jobs:
  report:
    name: Dependency report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The Google Services plugin needs this file to build. The analysis needs no API keys.
      - name: Create google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Analyse the dependencies
        continue-on-error: true
        run: ./gradlew buildHealth -PdependencyAnalysis

      - name: Show the report on the summary page
        if: always()
        run: |
          report=build/reports/dependency-analysis/build-health-report.txt
          echo "## Dependency analysis" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$report" ]; then
            echo "No report: the analysis didn't run to the end (see its step's log)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -s "$report" ]; then
            { echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to change: every declared dependency is used, and everything used is declared." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-analysis-report
          path: build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 30
