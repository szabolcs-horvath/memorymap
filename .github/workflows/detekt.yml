name: Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same JDK as the tests: Gradle needs one to start.
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Fails the check on new issues. Existing ones are listed in config/detekt/baseline.xml. Detekt reads no API keys,
      # so the job gets none.
      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('app/build/reports/detekt/detekt.sarif') != ''
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif

      - name: Upload Detekt report to Job Summary
        if: always()
        run: |
          echo "## Detekt Analysis Results" >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/detekt/detekt.md >> "$GITHUB_STEP_SUMMARY" || echo "No Detekt report found." >> "$GITHUB_STEP_SUMMARY"
