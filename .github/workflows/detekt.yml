name: Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties file
        run: |
          cat > local.properties <<'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          OAUTH_WEB_CLIENT_ID=${{ secrets.OAUTH_WEB_CLIENT_ID }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        id: detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Collect Detekt SARIF reports
        id: collect_sarif
        if: always()
        run: |
          mkdir -p build/reports/detekt-merged
          find . -type f -name "detekt.sarif" -path "*/build/reports/detekt/*" | while read -r file; do
            # Create a unique filename based on the path to avoid overwriting reports from different modules
            new_name=$(echo "${file#./}" | tr '/' '_')
            cp "$file" "build/reports/detekt-merged/$new_name"
          done
          if [ -d "build/reports/detekt-merged" ] && [ "$(ls -A build/reports/detekt-merged)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Detekt SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.collect_sarif.outputs.exists == 'true'
        with:
          sarif_file: build/reports/detekt-merged

      - name: Upload Detekt report to Job Summary
        if: always()
        run: |
          echo "## Detekt Analysis Results" >> $GITHUB_STEP_SUMMARY
          # Find and concatenate all markdown reports from subprojects
          find . -name "detekt.md" -path "*/build/reports/detekt/*" -exec cat {} + >> $GITHUB_STEP_SUMMARY || echo "No Detekt reports found." >> $GITHUB_STEP_SUMMARY
