name: Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties file
        run: |
          cat > local.properties <<'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          OAUTH_WEB_CLIENT_ID=${{ secrets.OAUTH_WEB_CLIENT_ID }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        id: detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload Detekt SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'build/reports/detekt/detekt.sarif'

      - name: Upload Detekt report to Job Summary
        if: always()
        run: |
          echo "## Detekt Analysis Results" >> $GITHUB_STEP_SUMMARY
          # Find and concatenate all markdown reports from subprojects
          find . -name "detekt.md" -path "*/build/reports/detekt/*" -exec cat {} + >> $GITHUB_STEP_SUMMARY || echo "No Detekt reports found." >> $GITHUB_STEP_SUMMARY

      - name: Check Detekt status
        if: always()
        run: |
          if [ "${{ steps.detekt.outcome }}" == "failure" ]; then
            echo "Detekt found issues. Please check the summary above."
            exit 1
          fi
        id: check_status
