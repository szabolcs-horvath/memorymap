name: Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Create local.properties file
        run: |
          cat > local.properties <<'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          OAUTH_WEB_CLIENT_ID=${{ secrets.OAUTH_WEB_CLIENT_ID }}
          EOF

      # Fails the check on new issues. Existing ones are listed in config/detekt/baseline.xml.
      - name: Run Detekt
        id: detekt
        run: ./gradlew detekt

      - name: Collect Detekt SARIF reports
        id: collect_sarif
        if: always()
        run: |
          mkdir -p build/reports/detekt-merged
          find . -type f -name "detekt.sarif" -path "*/build/reports/detekt/*" | while read -r file; do
            # Create a unique filename based on the path to avoid overwriting reports from different modules
            new_name=$(echo "${file#./}" | tr '/' '_')
            cp "$file" "build/reports/detekt-merged/$new_name"
          done
          if [ -d "build/reports/detekt-merged" ] && [ "$(ls -A build/reports/detekt-merged)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Detekt SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && steps.collect_sarif.outputs.exists == 'true'
        with:
          sarif_file: build/reports/detekt-merged

      - name: Upload Detekt report to Job Summary
        if: always()
        run: |
          echo "## Detekt Analysis Results" >> $GITHUB_STEP_SUMMARY
          # Find and concatenate all markdown reports from subprojects
          find . -name "detekt.md" -path "*/build/reports/detekt/*" -exec cat {} + >> $GITHUB_STEP_SUMMARY || echo "No Detekt reports found." >> $GITHUB_STEP_SUMMARY
