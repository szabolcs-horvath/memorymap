name: Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties file
        run: |
          cat > local.properties <<'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          OAUTH_WEB_CLIENT_ID=${{ secrets.OAUTH_WEB_CLIENT_ID }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload Detekt report to Job Summary
        if: always()
        run: |
          if [ -f build/reports/detekt/detekt.md ]; then
            cat build/reports/detekt/detekt.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Detekt status
        if: always()
        run: |
          # If the Run Detekt step failed, we want this job to fail too, 
          # but only after we've uploaded the summary.
          if [ "${{ steps.detekt.outcome }}" == "failure" ]; then
            exit 1
          fi
        id: check_status
