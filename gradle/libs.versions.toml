[versions]
# Build
kotlinGradlePlugin = "2.4.21"
agp = "9.5.1"
googleServices = "4.5.0"
ksp = "2.3.13"
detekt = "1.23.8"

# Core & UI
appcompat = "1.8.0"
constraintlayout = "2.2.2"
coreKtx = "1.19.1"
datastorePreferences = "1.3.0"
fragmentKtx = "1.9.1"
material = "1.14.0"
composeBom = "2026.09.00"
# Ahead of the BOM's 1.4.0: 1.5 has Material 3 Expressive's button groups and wavy progress indicators.
composeMaterial3 = "1.5.0-rc01"
lifecycleCompose = "2.11.0"
# For BackHandler; the version other libraries already bring in.
activityCompose = "1.8.2"
work = "2.12.0"
kotlinxCoroutines = "1.11.0"
pieChart = "0.7.0"

# Google Maps
places = "6.0.2"
playServicesLocation = "21.4.0"
playServicesMaps = "20.1.0"
androidMapsUtils = "7.0.0"

# Room
room = "2.8.5"

# Media
coil = "3.6.3"
# Zoomable photos that load sharper tiles as they zoom (the Compose media viewer)
telephoto = "0.19.0"
media3 = "1.11.1"
# Drag to reorder in lazy lists and grids
reorderable = "3.1.0"
exifinterface = "1.4.2"

# Auth
credentials = "1.6.0"
googleid = "1.2.1"
playServicesAuth = "22.0.0"

# Drive
googleApiServicesDrive = "v3-rev20261023-2.9.2"

# JSON
googleHttpClient = "2.2.0"

# Firebase
firebaseBom = "35.1.0"
firebaseCrashlytics = "3.0.8"
firebasePerf = "2.0.2"

# Testing
androidxJunitVersion = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestOrchestrator = "1.6.1"
androidxTestRunner = "1.7.0"
androidxTestServices = "1.6.0"
uiautomator = "2.4.1"
junitBom = "6.1.3"
mockk = "1.14.12"
robolectric = "4.17"
robolectricExtensionGradlePlugin = "0.9.0"

# Debug
leakcanary = "1.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinGradlePlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerf" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
robolectric-extension-gradle-plugin = { id = "tech.apter.junit5.jupiter.robolectric-extension-gradle-plugin", version.ref = "robolectricExtensionGradlePlugin" }

[libraries]
# Build
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlinGradlePlugin" }

# Core & UI
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
